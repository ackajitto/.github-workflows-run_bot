name: Meditation Auto Fill

on:
  schedule:
    - cron: '0 11 * * *'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6 # หรือเช็คว่าเวอร์ชันล่าสุดคืออะไร (ปกติใช้ v4 ตัวเดิมแต่ถ้าผู้พัฒนาออก v อัปเดตมาก็เปลี่ยน หรือปล่อยไว้ก็ได้)

      - name: Set up Python
        uses: actions/setup-python@v6 # อัปเดตเป็น setup-python เวอร์ชันล่าสุด
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install playwright requests
          playwright install chromium

      - name: Run script
        env:
          LINE_TOKEN: ${{ secrets.LINE_TOKEN }}
          LINE_TARGET_ID: ${{ secrets.LINE_TARGET_ID }}
          USERS_JSON: ${{ secrets.USERS_JSON }}
        run: python meditation_bot.py
